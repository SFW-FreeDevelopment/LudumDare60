<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Charlotte's Balloonatic</title>
    <base href="./" />
    <link href="css/boot-theme.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Balloonatic.styles.css" rel="stylesheet" />
</head>

<body>

    <div id="app"></div>
    <div id="boot-shell" role="status" aria-label="Warming up Charlotte's Balloonatic">
        <div class="boot-card">
            <img class="boot-cloud cloud-a" src="images/boot-cloud.png" alt="" />
            <img class="boot-cloud cloud-b" src="images/boot-cloud.png" alt="" />
            <img class="boot-cloud cloud-c" src="images/boot-cloud.png" alt="" />
            <img class="boot-hero" src="images/boot-hero.png" alt="Charlotte and her bunny in their pink balloon" />
            <img class="boot-logo" src="images/boot-logo.png" alt="Charlotte's Balloonatic" />
            <div class="boot-status"><img src="images/boot-warmup.svg" alt="" /></div>
            <img class="boot-dedication" src="images/boot-dedication.svg" alt="For Charlotte" />
        </div>
    </div>
    <div id="blazor-error-ui" role="alert" aria-label="The burner needs a rest. Reload the game.">
        <img class="boot-error-message" src="images/boot-error.svg" alt="" />
        <a href="" class="reload" aria-label="Reload game"><img src="images/boot-reload.svg" alt="" /></a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script>
        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }
        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());

            // begin game loop
            window.requestAnimationFrame(tickJS);
        };

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
            // The game's keyboard of record (see WebKeys): the game reads keys from the bridge,
            // not from KNI's Blazor key state, which stops updating after the first canvas click.
            if (window.__GAME && !event.repeat)
                window.__GAME.key(event.keyCode, true);
        });
        window.addEventListener("keyup", function(event)
        {
            if (window.__GAME)
                window.__GAME.key(event.keyCode, false);
        });
        window.addEventListener("blur", function()
        {
            // Keys held while the tab loses focus never fire keyup: clear the table so nothing sticks.
            if (window.__GAME) {
                window.__GAME.keyclear();
                window.__GAME.raw('focus','0');
            }
        });
        window.addEventListener("focus", function() {
            if(window.__GAME)window.__GAME.raw('focus','1');
        });
        document.addEventListener("visibilitychange", function() {
            if(window.__GAME)window.__GAME.raw('focus',document.hidden?'0':'1');
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
    <script src="shell.js"></script>
</body>

</html>
